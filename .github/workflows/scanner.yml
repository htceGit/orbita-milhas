name: Radar Órbita · sessões com pausa de 15 minutos
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      query_limit:
        description: Limite de consultas para teste (0 usa a configuração do portal)
        default: '0'
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: latam-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Verificar pausa entre sessões
        id: session
        env:
          SUPABASE_URL: https://czywkkvwwtcikigbxvty.supabase.co
        run: python3 -m worker.session_gate
      - uses: actions/setup-python@v5
        if: steps.session.outputs.run_scan == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
        if: steps.session.outputs.run_scan == 'true'
      - run: python -m playwright install --with-deps chromium
        if: steps.session.outputs.run_scan == 'true'
      - name: Consultar tarifas e salvar oportunidades
        if: steps.session.outputs.run_scan == 'true'
        env:
          SUPABASE_URL: https://czywkkvwwtcikigbxvty.supabase.co
          CALENDAR_HEADLESS: 'false'
          FLIGHTS_PROXY: ${{ secrets.FLIGHTS_PROXY }}
          QUERY_BUDGET_OVERRIDE: ${{ github.event.inputs.query_limit || '0' }}
        run: xvfb-run --auto-servernum python -m worker.main
