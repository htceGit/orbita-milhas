name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  continuation:
    name: Verificar configuração da continuidade
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Verificar temporizador com a identidade real do job
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m worker.dispatch_next --check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: pip install -r calendar_service/requirements.txt
      - run: python -m unittest discover -s calendar_service/tests -v
      - run: npm run test:db
      - run: npm run build
