name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  continuation:
    name: Verificar configuração da continuidade
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Verificar temporizador com a identidade real do job
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m worker.dispatch_next --check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: pip install -r calendar_service/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s calendar_service/tests -v
      - run: npm run test:db
      - run: npm run build
  container:
    name: Verificar imagem opcional do coletor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f calendar_service/Dockerfile -t orbita-calendar:check .
      - run: docker run --detach --name orbita-calendar-check orbita-calendar:check
      - name: Verificar inicialização sem credenciais de produção
        run: |
          docker exec -i orbita-calendar-check python - <<'PY'
          import json,time
          from urllib.request import urlopen,Request
          from urllib.error import HTTPError,URLError
          for attempt in range(20):
              try:
                  with urlopen('http://127.0.0.1:8080/health',timeout=2) as response:
                      assert json.load(response)['version']=='2.0.0'
                  break
              except URLError:
                  if attempt==19:raise
                  time.sleep(.5)
          try:
              urlopen(Request('http://127.0.0.1:8080/v1/calendar',data=b'{}',headers={'Content-Type':'application/json'}),timeout=2)
          except HTTPError as exc:
              assert exc.code==503,exc.code
          else:raise AssertionError('Captura liberada sem token configurado')
          print('Container iniciou e recusou captura sem token.')
          PY
      - if: always()
        run: docker rm --force orbita-calendar-check || true
